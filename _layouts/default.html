<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      {%- for n in site.data.nav %}
      <a href="{{ n.url | relative_url }}"{% if page.url == n.url %} aria-current="page"{% endif %}>{{ n.label }}</a>
      {%- endfor %}
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
    <p class="footer-meta"><a href="{{ '/all/' | relative_url }}">All pages</a> &middot; <a href="{{ '/COPYRIGHT/' | relative_url }}">Copyright</a></p>
    <p class="footer-meta">Written in plain text; the source lives in <a href="https://github.com/hartsock/hartsock.github.io">git</a>.</p>
  </footer>
</body>
</html>
