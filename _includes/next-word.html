<div class="figure" data-widget="next-word">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabCaptured" aria-selected="true" type="button" data-md="{{ page.path }}" data-md-key="copy.lesson_ui.captured">{{ page.copy.lesson_ui.captured }}</button>
        <button role="tab" id="tabLive" aria-selected="false" type="button" data-md="{{ page.path }}" data-md-key="copy.lesson_ui.try_words">{{ page.copy.lesson_ui.try_words }}</button>
      </div>
      <div class="controls" id="capturedControls">
        <label for="promptSel">Opening words <select id="promptSel"></select></label>
      </div>
      <div id="liveControls" hidden="">
        <div class="controls model-compare">
          <p data-md="{{ page.path }}" data-md-key="copy.lesson_ui.compare_help">{{ page.copy.lesson_ui.compare_help | markdownify | remove_first: '<p>' | remove: '</p>' | strip }}</p>
          <p data-md="{{ page.path }}" data-md-key="copy.lesson_ui.compare_link"><a href="/labs/model-comparison/">{{ page.copy.lesson_ui.compare_link }}</a></p>
          <label for="liveModel">Model for this experiment <select id="liveModel" aria-describedby="liveModelHelp"></select></label>
          <p class="note" id="liveModelHelp" data-md="{{ page.path }}" data-md-key="copy.lesson_ui.live_model_help">{{ page.copy.lesson_ui.live_model_help | markdownify | remove_first: '<p>' | remove: '</p>' | strip }}</p>
        </div>
        <div class="controls">
        <label for="livePrompt">Opening words <input id="livePrompt" type="text" value="{{ page.copy.lesson_ui.opening | escape }}" autocomplete="off"></label>
        <button class="btn primary" id="liveRun" type="button">Ask the model</button>
        <span class="muted mono" id="liveStatus" role="status"></span>
        </div>
      </div>
      <div class="controls">
        <label for="temp">Temperature <input id="temp" type="range" min="0" max="2" step="0.1" value="1"> <span id="tempVal" class="mono">1.0</span></label>
      </div>
      <div class="sentence" id="sentence" aria-live="polite"></div>
      <div class="bars" id="bars" role="list" aria-label="{{ page.copy.lesson_ui.odds_label }}"></div>
      <div class="stepper">
        <button class="btn" id="back" type="button" data-md="{{ page.path }}" data-md-key="copy.lesson_ui.previous">{{ page.copy.lesson_ui.previous }}</button>
        <button class="btn primary" id="fwd" type="button" data-md="{{ page.path }}" data-md-key="copy.lesson_ui.next">{{ page.copy.lesson_ui.next }}</button>
        <button class="btn" id="draw" type="button" data-md="{{ page.path }}" data-md-key="copy.lesson_ui.roll">{{ page.copy.lesson_ui.roll }}</button>
        <span class="where" id="where"></span>
      </div>
      <p class="note" id="sourceNote"></p>
    </div>
