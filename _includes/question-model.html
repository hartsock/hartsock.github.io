<div class="figure ask" data-widget="question-model">
      <label for="askBox" class="muted">Your question</label>
      <textarea id="askBox" data-md="{{ page.path }}" data-md-key="copy.lesson_ui.ask_box">{{ page.copy.lesson_ui.ask_box | markdownify | remove_first: '<p>' | remove: '</p>' | strip }}</textarea>
      <div class="row"><button class="btn primary" id="askBtn" type="button">Ask</button><span class="muted mono" id="askStatus"></span></div>
      <div class="answer" id="answer" aria-live="polite"><span class="who" data-md="{{ page.path }}" data-md-key="copy.lesson_ui.answer_empty">{{ page.copy.lesson_ui.answer_empty | markdownify | remove_first: '<p>' | remove: '</p>' | strip }}</span></div>
    </div>
