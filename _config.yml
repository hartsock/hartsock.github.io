title: Shawn Hartsock
tagline: Essays and series
description: >-
  Writing by Shawn Hartsock — short series on intelligence, systems, and the
  ideas that outlast their tools. Published in plain text; the source lives in git.
url: https://hartsock.github.io
baseurl: ""
author: Shawn Hartsock
lang: en
timezone: America/New_York

# Each "read" is one part of a series. Series metadata lives in _data/series.yml.
collections:
  reads:
    output: true
  wiki:
    output: true
    permalink: /wiki/:name/

defaults:
  - scope:
      path: "_reads/cruel-symmetry"
    values:
      sitemap: false
  - scope:
      path: "series/cruel-symmetry.md"
    values:
      sitemap: false
  - scope:
      path: ""
      type: reads
    values:
      layout: read
  - scope:
      path: ""
      type: posts
    values:
      layout: doc
  - scope:
      path: ""
      type: wiki
    values:
      layout: doc

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# The feed is the blog (_posts) only; jekyll-feed does that by default.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - scripts
  - .gitignore
